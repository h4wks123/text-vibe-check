<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="index.css" />
    <script src="index.js" defer></script>
  </head>
  <body id="text-checker">
    <h1 id="text-checker__title">Vibe Text Checker</h1>
    <button id="text-checker__pick-button" type="button">
      Pick text from page
    </button>
    <p id="text-checker__status" role="status">
      Click the button, then click a section on the page.
    </p>
    <label
      id="text-checker__selected-text-label"
      for="text-checker__selected-text"
      >Selected text</label
    >
    <textarea
      maxlength="1000"
      id="text-checker__selected-text"
      placeholder="Your selected text will appear here..."
    ></textarea>
    <button id="text-checker__submit-button" type="button">Submit</button>
    <p id="text-checker__is-valid">
      Text must not be empty or have less than or equal to 1000 characters
    </p>
  </body>
</html>
